services:
  - type: web
    name: content-factory-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_TEXT_MODEL
        value: openai/gpt-5.6-luna
      - key: OPENROUTER_CREATIVE_MODEL
        value: openai/gpt-5.6-luna
      - key: OPENROUTER_FINAL_SCRIPT_MODEL
        value: openai/gpt-5.6-luna
      - key: OPENROUTER_VALIDATION_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_IMAGE_MODEL
        value: google/gemini-2.5-flash-image
      - key: IMAGE_GENERATION_ENABLED
        value: "false"
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: HUGGINGFACE_API_TOKEN
        sync: false
