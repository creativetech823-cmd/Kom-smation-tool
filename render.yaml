services:
  - type: web
    name: content-factory-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_TEXT_MODEL
        value: gemini-flash-latest
      - key: GEMINI_COMPLIANCE_MODEL
        value: gemini-pro-latest
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
